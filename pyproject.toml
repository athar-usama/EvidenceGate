[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencegate"
version = "0.1.0"
description = "Consensus-gated, conformally-calibrated grounding for verifiable vision-language agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scikit-image>=0.23",
    "torch>=2.3",
    "transformers>=4.44",
    "timm>=1.0",
    "einops>=0.8",
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
